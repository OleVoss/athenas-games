<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Game - Athenas Games Archive</title>
</head>
<body>
    <header>
        <a href="./index.html" class="btn-secondary">← Back to Archive</a>
        <h1>Submit a New Game</h1>
    </header>

    <main>
        <form id="game-submit-form" class="form-container">
            <div class="form-group">
                <label for="title">Game Title *</label>
                <input type="text" id="title" name="title" placeholder="e.g., Mafia / Werewolf" required />
            </div>

            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Select a category...</option>
                    <option value="word">Word / Verbal Game</option>
                    <option value="card_poker">Standard Poker Deck</option>
                    <option value="pen_paper">Pen & Paper</option>
                    <option value="icebreaker">Icebreaker / Party</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="min_players">Min Players *</label>
                    <input type="number" id="min_players" name="min_players" min="1" placeholder="2" required />
                </div>
                <div class="form-group">
                    <label for="max_players">Max Players *</label>
                    <input type="number" id="max_players" name="max_players" min="1" placeholder="8" required />
                </div>
                <div class="form-group">
                    <label for="duration">Duration (minutes) *</label>
                    <input type="number" id="duration" name="duration" min="1" placeholder="15" required />
                </div>
            </div>

            <div class="form-group">
                <label for="tags">Tags (comma-separated)</label>
                <input type="text" id="tags" name="tags" placeholder="bluffing, quick, kids-friendly, no-prep" />
            </div>

            <div class="form-group">
                <label for="summary">Short Summary *</label>
                <input type="text" id="summary" name="summary" placeholder="A quick 1-sentence description of the game." required />
            </div>

            <div class="form-group">
                <label for="rules_setup">Setup Instructions</label>
                <textarea id="rules_setup" name="rules_setup" rows="3" placeholder="How to prepare before playing..."></textarea>
            </div>

            <div class="form-group">
                <label for="rules_gameplay">How to Play / Rules *</label>
                <textarea id="rules_gameplay" name="rules_gameplay" rows="6" placeholder="Explain the turns, actions, and winning conditions..." required></textarea>
            </div>

            <div class="form-group">
                <label for="game_image">Optional Image / Diagram</label>
                <input type="file" id="game_image" name="game_image" accept="image/*" />
            </div>

            <button type="submit" class="btn-primary">Submit Game for Review</button>
        </form>
    </main>

    <script type="module" src="./js/submit.js"></script>
</body>
</html>
